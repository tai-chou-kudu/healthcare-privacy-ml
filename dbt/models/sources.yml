version: 2

sources:
  - name: capstone
    description: >
      MIMIC-III derived dataset preprocessed for the Privacy-Utility Tradeoffs
      in Healthcare AI capstone (DATA 698, CUNY SPS, Spring 2026).
      Access requires CITI training and PhysioNet Data Use Agreement.
    database: project-c29d8542-a733-449a-996
    schema: capstone_final_dataset
    tables:
      - name: final_table
        description: >
          Preprocessed MIMIC-III cohort: adult admissions ages 18-89.
          Contains demographics, 6 lab values, and two prediction targets.
        columns:
          - name: subject_id
            description: De-identified patient identifier (INT64).
          - name: hadm_id
            description: Hospital admission identifier (INT64).
          - name: age_at_admission
            description: Patient age at admission, capped at 89 per MIMIC-III de-identification.
          - name: gender
            description: Patient gender (M/F).
          - name: ethnicity
            description: Raw ethnicity string (41 distinct values in MIMIC-III).
          - name: admission_type
            description: Admission type (EMERGENCY, ELECTIVE, URGENT).
          - name: hospital_expire_flag
            description: In-hospital mortality (1=died, 0=survived). 10.86% positive rate.
          - name: readmitted_30
            description: 30-day readmission among survivors (1=readmitted, 0=not). 6.25% positive rate.
          - name: creatinine
            description: Serum creatinine (mg/dL).
          - name: bun
            description: Blood urea nitrogen (mg/dL).
          - name: lactate
            description: Serum lactate (mmol/L).
          - name: bicarbonate
            description: Serum bicarbonate (mEq/L).
          - name: wbc
            description: White blood cell count (K/uL).
          - name: sodium
            description: Serum sodium (mEq/L).
